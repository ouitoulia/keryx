          admin_label: ''
          plugin_id: text
          empty: false
          content:
            value: "<div class=\"col-xl-7\">\r\n  <p class=\"font-serif\">\r\n      La trasparenza è intesa come <strong>accessibilità totale</strong> dei dati e documenti detenuti dalle pubbliche amministrazioni, allo scopo di tutelare i diritti dei cittadini, promuovere la partecipazione e favorire forme diffuse di controllo sull'uso delle risorse pubbliche. Questo principio è sancito dal <a class=\"text-underline\" href=\"https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2013-03-14;33\" target=\"_blank\" title=\"Leggi il testo del d.lgs. 33 del 2013. [Nuova finestra]\">d.lgs n. 33 del 2013</a> e rafforzato dal <a class=\"text-underline\" href=\"https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2016-05-25;97\" target=\"_blank\" title=\"Leggi il testo del d.lgs. 97 del 2016. [Nuova finestra]\">d.lgs n. 97 del 2016</a> (noto come FOIA italiano), qualifica la trasparenza come \"livello essenziale delle prestazioni\" erogate dalla scuola.\r\n  </p>\r\n  <p class=\"font-serif\">\r\n      Il Responsabile della Prevenzione della Corruzione e della Trasparenza (RPCT) per le istituzioni scolastiche è il Direttore Generale dell’Ufficio Scolastico Regionale (USR) competente (<a class=\"text-underline\" href=\"https://www.mim.gov.it/documents/20182/400076/D.M.+325++del+26+maggio+2017.pdf/9cdb4c38-ce96-c80e-f6c2-ca53a63c9216?t=1559754496911\" target=\"_blank\" title=\"Leggi il testo del D.M. n. 325/2017 in una nuova finestra\">D.M. n. 325/2017</a>). Al Dirigente Scolastico compete la manutenzione e il popolamento della sezione sul sito dell'Istituto, assicurando la qualità, l'integrità e il costante aggiornamento dei dati. L'assolvimento degli obblighi di pubblicazione è oggetto di attestazione annuale da parte dei Revisori dei Conti, che svolgono per le scuole le funzioni di OIV.\r\n  </p>\r\n</div>\r\n\r\n<div class=\"col-xl-4 offset-xl-1\">\r\n  <p>Altri riferimenti utili:</p>\r\n  <div class=\"link-list-wrapper\">\r\n    <ul class=\"link-list\">\r\n        <li><a class=\"list-item\" href=\"https://www.anticorruzione.it/amministrazione-trasparente/altri-contenuti-prevenzione-della-corruzione/piano-triennale-di-prevenzione-della-corruzione\" target=\"_blank\" title=\"Piano Nazionale Anticorruzione (PNA) 2026-2028 [Nuova finestra]\"><span>Piano Nazionale Anticorruzione (PNA) 2026-2028</span></a></li>\r\n        <li><a class=\"list-item\" href=\"https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:2012-11-06;190\" target=\"_blank\" title=\"Leggi il testo della Legge n. 190 del 2012. [Nuova finestra]\"><span>Legge n. 190 del 2012</span></a></li>\r\n        <li><a class=\"list-item\" href=\"https://www.normattiva.it/eli/id/2023/03/31/23G00044/CONSOLIDATED\" target=\"_blank\" title=\"D.Lgs. n. 36 del 2023 (Nuovo Codice dei Contratti Pubblici) [Nuova finestra]\"><span>D.Lgs. n. 36 del 2023 (Nuovo Codice dei Contratti Pubblici)</span></a></li>\r\n        <li><a class=\"list-item\" href=\"https://www.anticorruzione.it/-/delibera-n.-168-del-15-aprile-2026\" target=\"_blank\" title=\"Delibera ANAC n. 168 del 15 aprile 2026 (Verifiche e attestazioni OIV 2026) [Nuova finestra]\"><span>Delibera ANAC n. 168 del 15 aprile 2026 (Verifiche e attestazioni OIV 2026)</span></a></li>\r\n        <li><a class=\"list-item\" href=\"https://www.anticorruzione.it/-/del.481.2025\" target=\"_blank\" title=\"Delibere ANAC n. 495/2024 e n. 481/2025 (Schemi standard di pubblicazione) [Nuova finestra]\"><span>Delibere ANAC n. 495/2024 e n. 481/2025 (Schemi standard di pubblicazione)</span></a></li>\r\n    </ul>\r\n  </div>\r\n</div>"
            format: bootstrap_italia_2
